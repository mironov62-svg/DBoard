<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Участок СМТ — статус ремонтов</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 0;
            overflow-y: auto;
        }
        
        .card {
            max-width: 1400px;
            width: 100%;
            background: transparent;
            display: block;
            height: auto !important;
            min-height: 0 !important;
            overflow: visible;
            padding: 15px 20px;
        }

        h1 {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 20px;
            color: #0b1e3a;
            margin-bottom: 0;
        }
        h1 small {
            font-weight: 400;
            font-size: 14px;
            color: #5a6d86;
            margin-left: 4px;
        }
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 12px;
            border-bottom: 1px solid #e6edf5;
            padding-bottom: 8px;
        }
        .bitrix-link {
            background: #f0f4fe;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: #1d4ed8;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.15s;
        }
        .bitrix-link i { font-size: 12px; }
        .bitrix-link:hover { background: #e2eaff; color: #0f3bb3; }
        
        .btn-request {
            background: #1d4ed8;
            border: none;
            color: white;
            font-weight: 600;
            font-size: 13px;
            padding: 6px 16px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(29,78,216,0.2);
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-request i { font-size: 13px; }
        .btn-request:hover { background: #1744c0; transform: translateY(-1px); }
        .btn-request:active { transform: translateY(0); }
        .btn-request:disabled { opacity: 0.6; pointer-events: none; }

        /* --- ГРАФИЧЕСКАЯ ЧАСТЬ --- */
        .flow-container {
            margin: 0;
            overflow-x: auto;
            overflow-y: visible;
            padding: 8px 0 10px;
        }
        .flow-row {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            position: relative;
            gap: 40px;
            width: 100%;
            overflow: visible;
            min-width: fit-content;
        }

        .stage-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            width: 70px;
            cursor: pointer;
            flex-shrink: 0;
            overflow: visible;
        }

        .stage-wrapper:not(:last-child)::after {
            content: '';
            position: absolute;
            top: 35px;
            left: 70px;
            width: 40px;
            height: 2px;
            background: #1d4ed8;
            z-index: 0;
        }

        .stage-circle {
            position: relative;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: white;
            border: 3px solid #1d4ed8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 22px;
            color: #1d4ed8;
            z-index: 2;
            box-shadow: 0 0 0 6px white;
            transition: all 0.2s;
            cursor: pointer;
            flex-shrink: 0;
        }
        .stage-circle:hover {
            transform: scale(1.05);
            box-shadow: 0 0 0 6px white, 0 4px 15px rgba(29,78,216,0.2);
        }
        .stage-circle.active {
            border-color: #22c55e;
            background: #f0faf4;
        }
        
        /* Зеленый бейдж (верхний правый угол) */
        .stage-circle .count-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #22c55e;
            color: white;
            font-size: 13px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 30px;
            min-width: 26px;
            text-align: center;
            box-shadow: 0 2px 6px rgba(34, 197, 94, 0.3);
            border: 2px solid white;
            line-height: 1.3;
            z-index: 3;
        }

        /* Красный бейдж (нижний правый угол, симметрично зеленому) */
        .stage-circle .alert-badge {
            position: absolute;
            top: auto;
            bottom: -8px;
            right: -8px;
            background: #ef4444;
            color: white;
            font-size: 11px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 20px;
            min-width: 20px;
            text-align: center;
            box-shadow: 0 2px 6px rgba(239, 68, 68, 0.4);
            border: 2px solid white;
            line-height: 1.2;
            z-index: 4;
            animation: pulse-red 2s infinite;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .stage-label {
            font-size: 12px;
            font-weight: 500;
            color: #1e2f4a;
            text-align: center;
            line-height: 1.2;
            margin-top: 8px;
            width: 100%;
            min-height: 28px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        /* --- ВЫПАДАЮЩИЙ СПИСОК --- */
        .stage-dropdown {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border: 1px solid #e6edf5;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 12px 16px;
            min-width: 400px;
            max-width: 80vw;
            max-height: 70vh;
            overflow-y: auto;
            z-index: 1000;
            text-align: left;
        }
        .stage-dropdown.open { display: block; }
        .stage-dropdown .dropdown-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px; padding-bottom: 8px; border-bottom: 2px solid #1d4ed8;
        }
        .stage-dropdown .dropdown-header h3 { font-size: 16px; color: #0b1e3a; margin: 0; }
        .stage-dropdown .dropdown-close {
            background: none; border: none; font-size: 20px; color: #7a8aa0; cursor: pointer; padding: 0 5px;
        }
        .stage-dropdown .dropdown-close:hover { color: #1d4ed8; }
        
        .stage-dropdown .deal-item {
            padding: 8px 0;
            border-bottom: 1px solid #f0f4fe;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .stage-dropdown .deal-item:last-child { border-bottom: none; padding-bottom: 0; }
        
        .stage-dropdown .deal-alert-icon {
            color: #ef4444;
            font-size: 14px;
            min-width: 16px;
            text-align: center;
        }

        /* Ссылка-название сделки */
        .stage-dropdown .deal-title-link {
            flex: 1;
            color: #1e2f4a;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            display: block;
            transition: color 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .stage-dropdown .deal-title-link:hover {
            color: #1d4ed8;
            text-decoration: underline;
        }
        
        /* Дополнительное поле UF */
        .stage-dropdown .deal-uf-field {
            color: #5a6d86;
            font-size: 13px;
            margin-left: 6px;
            font-weight: 400;
        }

        .stage-dropdown .empty-message { color: #7a8aa0; font-size: 13px; text-align: center; padding: 15px 0; }
        
        .dropdown-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.3); z-index: 999;
        }
        .dropdown-overlay.active { display: block; }

        .footer-note {
            margin-top: 12px; border-top: 1px solid #e6edf5; padding-top: 10px;
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; font-size: 12px; color: #5a6d86; position: relative; z-index: 1;
        }
        .footer-note .legend { display: flex; gap: 15px; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .legend-dot { width: 10px; height: 10px; border-radius: 10px; background: #1d4ed8; border: 2px solid #1d4ed8; }
        .legend-dot.green { background: #22c55e; border-color: #22c55e; }
        .legend-dot.red { background: #ef4444; border-color: #ef4444; }
        .webhook-info { font-size: 10px; color: #7a8aa0; background: #f8f9fa; padding: 3px 10px; border-radius: 12px; border: 1px solid #e6edf5; }
        .status-message { background: #f0f4fe; padding: 4px 12px; border-radius: 12px; color: #1f3b5c; font-size: 12px; border: 1px solid #dbeafe; }
        .status-message i { margin-right: 4px; }

        body.modal-open { overflow: hidden; }

        @media (max-width: 900px) {
            .flow-row { gap: 25px; }
            .stage-wrapper:not(:last-child)::after { width: 25px; left: 70px; }
            .card { padding: 12px 15px; }
            .stage-dropdown { min-width: 300px; max-width: 90vw; }
        }
        @media (max-width: 600px) {
            .flow-row { gap: 15px; flex-wrap: nowrap; }
            .stage-wrapper:not(:last-child)::after { width: 15px; left: 60px; top: 30px; }
            .stage-circle { width: 60px; height: 60px; font-size: 18px; box-shadow: 0 0 0 5px white; }
            .stage-label { font-size: 10px; min-height: 24px; margin-top: 6px; }
            .stage-wrapper { width: 60px; }
            .stage-dropdown { min-width: 260px; max-width: 92vw; padding: 10px 12px; }
            .stage-dropdown .dropdown-header h3 { font-size: 14px; }
            .stage-dropdown .deal-title-link { white-space: normal; }
        }
    </style>
</head>
<body>

<div class="dropdown-overlay" id="dropdownOverlay"></div>

<div class="card">
    <div class="toolbar">
        <h1>
            <i class="fas fa-tools" style="color:#1d4ed8;"></i> Участок СМТ
            <small>ремонты</small>
        </h1>
        <div style="display: flex; gap: 8px; align-items: center;">
            <a class="bitrix-link" href="https://b24-964ige.bitrix24.ru/" target="_blank">
                <i class="fas fa-external-link-alt"></i> Битрикс24
            </a>
            <button class="btn-request" id="fetchBtn">
                <i class="fas fa-sync-alt"></i> Запрос
            </button>
        </div>
    </div>

    <div class="flow-container" id="flowContainer">
        <div class="flow-row" id="flowRow"></div>
    </div>

    <div class="footer-note">
        <div class="legend">
            <span class="legend-item"><span class="legend-dot"></span> стадия</span>
            <span class="legend-item"><span class="legend-dot green"></span> всего</span>
            <span class="legend-item"><span class="legend-dot red"></span> проблема</span>
            <span class="legend-item"><i class="fas fa-mouse-pointer" style="color:#1d4ed8;"></i> клик</span>
        </div>
        <div class="webhook-info"><i class="fas fa-cloud-upload-alt"></i> n8n.gmtnsk.ru</div>
        <div id="statusMessage" class="status-message"><i class="fas fa-info-circle"></i> Нажмите "Запрос"</div>
    </div>
</div>

<script>
    (function() {
        const STAGE_MAP = {
            'C12:NEW': 'Новая',
            'C12:UC_L90PZM': 'Решение о ремонте',
            'C12:PREPAYMENT_INVOICE': 'Диагностика, ремонт',
            'C12:UC_9ESR0K': 'Заказаны 3Ч',
            'C12:UC_L294GC': '3Ч получена',
            'C12:4': 'Готово',
            'C12:UC_3M5ZEE': 'На выдачу'
        };

        const STAGE_ORDER = Object.keys(STAGE_MAP);
        const STAGE_NAMES = STAGE_MAP;

        // Стадии, где нужен красный бейдж
        const ALERT_STAGES = {
            'C12:UC_L90PZM': true,   // Решение о ремонте
            'C12:PREPAYMENT_INVOICE': true // Диагностика, ремонт
        };

        let dealsData = {};
        let alertCounts = {}; 
        let openDropdown = null;
        let stageElements = {};

        const flowRow = document.getElementById('flowRow');
        const statusMsg = document.getElementById('statusMessage');
        const fetchBtn = document.getElementById('fetchBtn');
        const overlay = document.getElementById('dropdownOverlay');

        function createStageElements() {
            flowRow.innerHTML = '';
            stageElements = {};

            STAGE_ORDER.forEach((stageId, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'stage-wrapper';
                wrapper.dataset.stage = stageId;

                const circle = document.createElement('div');
                circle.className = 'stage-circle';
                circle.id = `circle-${index}`;
                
                let badgeHtml = `<span class="count-badge" id="badge-${index}">0</span>`;
                
                if (ALERT_STAGES[stageId]) {
                    badgeHtml += `<span class="alert-badge" id="alert-${index}" style="display:none">0</span>`;
                }
                
                circle.innerHTML = `<span>${index + 1}</span>${badgeHtml}`;

                const label = document.createElement('div');
                label.className = 'stage-label';
                label.textContent = STAGE_NAMES[stageId] || stageId;

                const dropdown = document.createElement('div');
                dropdown.className = 'stage-dropdown';
                dropdown.id = `dropdown-${index}`;
                dropdown.innerHTML = `
                    <div class="dropdown-header">
                        <h3>${STAGE_NAMES[stageId] || stageId}</h3>
                        <button class="dropdown-close">&times;</button>
                    </div>
                    <div class="dropdown-content"></div>
                `;

                wrapper.appendChild(circle);
                wrapper.appendChild(label);
                wrapper.appendChild(dropdown);
                flowRow.appendChild(wrapper);

                const alertEl = ALERT_STAGES[stageId] ? document.getElementById(`alert-${index}`) : null;

                stageElements[stageId] = {
                    wrapper, circle, dropdown,
                    content: dropdown.querySelector('.dropdown-content'),
                    badge: document.getElementById(`badge-${index}`),
                    alertBadge: alertEl,
                    closeBtn: dropdown.querySelector('.dropdown-close')
                };

                circle.addEventListener('click', (e) => { e.stopPropagation(); toggleDropdown(stageId); });
                stageElements[stageId].closeBtn.addEventListener('click', (e) => { e.stopPropagation(); closeDropdown(); });
                
                dropdown.addEventListener('click', (e) => {
                    if (e.target.closest('a')) return;
                    e.stopPropagation();
                });
            });

            overlay.addEventListener('click', closeDropdown);
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDropdown(); });
        }

        function toggleDropdown(stageId) {
            const el = stageElements[stageId];
            if (!el) return;
            if (openDropdown === stageId) { closeDropdown(); return; }
            
            closeDropdown();
            el.dropdown.classList.add('open');
            el.circle.classList.add('active');
            overlay.classList.add('active');
            document.body.classList.add('modal-open');
            openDropdown = stageId;
            renderDropdownContent(stageId);
        }

        function closeDropdown() {
            if (!openDropdown) return;
            const el = stageElements[openDropdown];
            if (el) { el.dropdown.classList.remove('open'); el.circle.classList.remove('active'); }
            openDropdown = null;
            overlay.classList.remove('active');
            document.body.classList.remove('modal-open');
        }

        function renderDropdownContent(stageId) {
            const el = stageElements[stageId];
            if (!el) return;
            const deals = dealsData[stageId] || [];
            
            if (deals.length === 0) {
                el.content.innerHTML = `<div class="empty-message">Нет сделок</div>`;
                return;
            }

            let html = '';
            deals.forEach((deal, index) => {
                const url = `https://b24-964ige.bitrix24.ru/crm/deal/show/${deal.ID}/`;
                
                const alertIcon = deal._isAlert 
                    ? `<i class="fas fa-exclamation-circle deal-alert-icon"></i>` 
                    : `<span style="width:16px;display:inline-block"></span>`;
                
                // Формируем текст с UF-полем
                let titleText = deal.TITLE;
                if (deal.UF_EXTRA && String(deal.UF_EXTRA).trim() !== '') {
                    titleText += ` <span class="deal-uf-field">(${deal.UF_EXTRA})</span>`;
                }
                
                html += `
                    <div class="deal-item">
                        ${alertIcon}
                        <a href="${url}" target="_blank" class="deal-title-link">${titleText}</a>
                    </div>
                `;
            });
            el.content.innerHTML = html;
        }

        function checkAlertCondition(deal, stageId) {
            if (stageId === 'C12:UC_L90PZM') {
                if (!deal.BEGINDATE) return false;
                const beginDate = new Date(deal.BEGINDATE);
                const now = new Date();
                const moscowOffset = 3 * 60 * 60 * 1000; 
                const nowMoscow = new Date(now.getTime() + (now.getTimezoneOffset() * 60000) + moscowOffset);
                
                const deadline = new Date(beginDate.getTime() + (3 * 24 * 60 * 60 * 1000));
                return nowMoscow > deadline;
            }
            
            if (stageId === 'C12:PREPAYMENT_INVOICE') {
                const ufValue = parseInt(deal.UF_CRM_1785307987, 10);
                return !isNaN(ufValue) && ufValue > 9;
            }
            
            return false;
        }

        function updateStages(countsMap, dealsMap) {
            dealsData = dealsMap || {};
            alertCounts = {};
            let totalDeals = 0;

            STAGE_ORDER.forEach((stageId, idx) => {
                const count = countsMap[stageId] || 0;
                totalDeals += count;
                const el = stageElements[stageId];
                
                if (el) {
                    el.badge.textContent = count;
                    
                    if (el.alertBadge) {
                        const alerts = (dealsMap[stageId] || []).filter(d => d._isAlert).length;
                        alertCounts[stageId] = alerts;
                        
                        if (alerts > 0) {
                            el.alertBadge.style.display = 'block';
                            el.alertBadge.textContent = alerts;
                        } else {
                            el.alertBadge.style.display = 'none';
                        }
                    }
                }
                
                if (openDropdown === stageId) renderDropdownContent(stageId);
            });

            if (totalDeals === 0) {
                statusMsg.innerHTML = `<i class="fas fa-database"></i> Нет сделок (0)`;
            } else {
                const totalAlerts = Object.values(alertCounts).reduce((a,b)=>a+b, 0);
                const alertText = totalAlerts > 0 ? ` (<b style="color:#ef4444">${totalAlerts} проблемных</b>)` : '';
                statusMsg.innerHTML = `<i class="fas fa-check-circle" style="color:#22c55e;"></i> Загружено: ${totalDeals}${alertText}`;
            }
        }

        function parseWebhookResponse(data) {
            let counts = {};
            let dealsMap = {};
            STAGE_ORDER.forEach(id => { counts[id] = 0; dealsMap[id] = []; });

            let dealsArray = null;
            if (Array.isArray(data) && data.length > 0 && data[0].deals && Array.isArray(data[0].deals)) {
                dealsArray = data[0].deals;
            } else if (data.deals && Array.isArray(data.deals)) {
                dealsArray = data.deals;
            } else if (Array.isArray(data) && data.length > 0 && data[0].STAGE_ID) {
                dealsArray = data;
            }

            if (dealsArray) {
                const uniqueDeals = new Map();
                dealsArray.forEach(deal => {
                    const dealId = deal.ID;
                    if (uniqueDeals.has(dealId)) return;
                    const stageId = deal.STAGE_ID;
                    
                    if (stageId && STAGE_MAP.hasOwnProperty(stageId)) {
                        uniqueDeals.set(dealId, stageId);
                        counts[stageId] = (counts[stageId] || 0) + 1;
                        
                        let title = deal.TITLE || deal.NAME || '';
                        if (!title) title = `Сделка №${deal.ID}`;
                        
                        const isAlert = checkAlertCondition(deal, stageId);
                        
                        // ИЗМЕНЕНИЕ: Сохраняем значение UF_CRM_1595995680751
                        dealsMap[stageId].push({
                            ID: deal.ID,
                            TITLE: title,
                            STAGE_ID: stageId,
                            BEGINDATE: deal.BEGINDATE,
                            UF_CRM_1785307987: deal.UF_CRM_1785307987,
                            UF_EXTRA: deal.UF_CRM_1595995680751, // Новое поле
                            _isAlert: isAlert
                        });
                    }
                });
            }
            return { counts, dealsMap };
        }

        async function fetchRepairData() {
            const webhookUrl = 'https://n8n.gmtnsk.ru/webhook/be75ff19-3f4e-478e-b6d7-661f037f2626';
            fetchBtn.disabled = true;
            fetchBtn.innerHTML = `<i class="fas fa-spinner fa-pulse"></i>`;
            statusMsg.innerHTML = `<i class="fas fa-spinner fa-pulse"></i> Загрузка...`;

            try {
                const response = await fetch(webhookUrl, {
                    method: 'POST', mode: 'cors', cache: 'no-cache',
                    headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'get_status', timestamp: new Date().toISOString(), source: 'smt_dashboard' })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                const { counts, dealsMap } = parseWebhookResponse(data);
                
                const total = Object.values(counts).reduce((a, b) => a + b, 0);
                if (total === 0) {
                    statusMsg.innerHTML = `<i class="fas fa-exclamation-triangle" style="color:#b91c1c;"></i> Пусто`;
                    STAGE_ORDER.forEach(id => { counts[id]=0; dealsMap[id]=[]; });
                }
                updateStages(counts, dealsMap);

            } catch (error) {
                console.error('Ошибка:', error);
                statusMsg.innerHTML = `<i class="fas fa-exclamation-triangle" style="color:#b91c1c;"></i> Ошибка`;
                STAGE_ORDER.forEach(id => { counts[id]=0; dealsMap[id]=[]; });
                updateStages({}, {});
            } finally {
                fetchBtn.disabled = false;
                fetchBtn.innerHTML = `<i class="fas fa-sync-alt"></i> Запрос`;
            }
        }

        fetchBtn.addEventListener('click', fetchRepairData);
        createStageElements();

        window.addEventListener('load', () => {
            STAGE_ORDER.forEach(id => { 
                stageElements[id].badge.textContent = '0';
                if(stageElements[id].alertBadge) stageElements[id].alertBadge.style.display = 'none';
            });
            statusMsg.innerHTML = `<i class="fas fa-info-circle"></i> Нажмите "Запрос"`;
        });

    })();
</script>

</body>
</html>
